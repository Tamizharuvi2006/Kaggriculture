[package]
name = "fastsim"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Research Team"]
description = "High-fidelity native Rust research engine and simulator for Kaggriculture."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand_mt = "4.2"
rayon = "1.10"

[lib]
name = "fastsim"
path = "src/lib.rs"

[[bin]]
name = "fastsim"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
